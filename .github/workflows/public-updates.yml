name: Renew and publish signed public updates
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Renew existing metadata now
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nexpilot-public-distribution
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'nexdev-team/NexPilot-updates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: public-update-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none
      - run: python3 tests/update-renewal.test.py
      - name: Renew existing signed public metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXPILOT_SIGNING_KEY_B64: ${{ secrets.NEXPILOT_SIGNING_KEY_B64 }}
          RENEW_FORCE: ${{ inputs.force || false }}
        run: |
          php -r 'require "scripts/renew-update.php"; $key=base64_decode(getenv("NEXPILOT_SIGNING_KEY_B64"),true); if(!is_string($key)||strlen($key)!==64)exit("Signing identity unavailable\n"); $public=sodium_crypto_sign_publickey_from_secretkey($key); sodium_memzero($key); echo "Configured public trust fingerprint: ".hash("sha256",$public).PHP_EOL; if(!hash_equals(base64_decode(RENEW_PUBLIC),$public))exit(1);'
          if [ "$RENEW_FORCE" = "true" ]; then
            python3 scripts/renew-update.py --force
          else
            python3 scripts/renew-update.py
          fi
      - name: Assemble strict public artifact allowlist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-pages.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed public files only
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
